name: Backend CI

on:
    push:
        branches:
            - master
        paths:
            - 'apps/server/**'
            - '.github/workflows/**/*.yml'

    pull_request:
        branches:
            - master
        paths:
            - 'apps/server/**'
            - '.github/workflows/**/*.yml'

permissions:
    contents: read

concurrency:
    group: backend-ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Build and Test
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: oj_test
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d oj_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine
                ports:
                    - 6380:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        defaults:
            run:
                working-directory: apps/server

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 12.21.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: apps/server/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Create test environment
              run: |
                  cat > .env.test <<'EOF'
                  NODE_ENV=test
                  DATABASE_URL=postgresql://postgres:postgres@localhost:5433/oj_test
                  ACCESS_TOKEN_SECRET=some_secret
                  REDIS_URL=redis://127.0.0.1:6380
                  CLIENT_URL=http://localhost:3000
                  EOF

            - name: Pull execution images
              run: |
                  docker pull naman22a/oj-cpp:1.0.0
                  docker pull naman22a/oj-java:1.0.0
                  docker pull naman22a/oj-python:1.0.0
                  docker pull naman22a/oj-javascript:1.0.0

            - name: Verify Docker daemon
              run: docker info

            - name: Build
              run: pnpm build

            - name: Run database migrations
              run: |
                  set -a
                  source .env.test
                  set +a
                  pnpm exec mikro-orm migration:up
              env:
                  NODE_ENV: test

            - name: Run tests
              run: pnpm test -- --no-file-parallelism
              env:
                  NODE_ENV: test
