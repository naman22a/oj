
services:
  postgres-test:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: oj_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oj_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - oj_test_data:/var/lib/postgresql/data

volumes:
  oj_test_data:
